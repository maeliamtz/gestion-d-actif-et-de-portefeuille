name: Mise à jour mensuelle de l'indice GAP

on:
  schedule:
    - cron: "17 6 3 * *"    # le 3 de chaque mois à 6h17 (UTC)
    - cron: "17 6 18 * *"   # et le 18, pour récupérer les données publiées en retard
  workflow_dispatch:         # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  calcul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Télécharger les données (FRED, MSCI, Yahoo, multpl...)
        if: github.event_name != 'push'
        run: python scripts/telecharger.py

      - name: Calculer l'indice et préparer le site
        run: python scripts/export_site.py

      - name: Enregistrer les nouvelles données dans le dépôt
        if: github.event_name != 'push'
        run: |
          git config user.name "robot-gap"
          git config user.email "robot-gap@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publication:
    needs: calcul
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
